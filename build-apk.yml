name: Build LanChat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Allow gradlew to run
        run: chmod +x gradlew

      - name: Build the APK
        run: ./gradlew assembleDebug

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: lanchat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
